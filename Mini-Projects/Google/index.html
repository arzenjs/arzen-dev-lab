<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A frontend recreation of the Google homepage — searches redirect to real Google results.">
    <meta name="author" content="Arsalan">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="Assets/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="skip-link" href="#search-input">Skip to search</a>

    <header class="site-header">
        <nav class="nav-group nav-left" aria-label="Google">
            <a href="https://about.google/" class="nav-link">About</a>
            <a href="https://store.google.com/" class="nav-link">Store</a>
        </nav>

        <nav class="nav-group nav-right" aria-label="Google services">
            <a href="https://mail.google.com/" class="nav-link">Gmail</a>
            <a href="https://www.google.com/imghp" class="nav-link">Images</a>
            <a href="https://www.google.com/intl/en/about/products" class="apps-link" aria-label="Google apps">
                <img src="Assets/9-Dot.svg" alt="" class="apps-icon" width="24" height="24">
            </a>
            <a href="https://accounts.google.com/ServiceLogin" class="signin-btn">Sign in</a>
        </nav>
    </header>

    <main>
        <a href="https://www.google.com/" class="logo-link" aria-label="Google home">
            <img src="Assets/logo.svg" alt="Google" class="logo" width="272" height="92">
        </a>

        <form class="search-form" id="search-form" action="https://www.google.com/search" method="get" role="search">
            <label class="sr-only" for="search-input">Search Google</label>
            <div class="search-box">
                <img src="Assets/search.svg" alt="" class="search-icon" aria-hidden="true">
                <input type="search" id="search-input" name="q" class="search-bar" placeholder="Search Google"
                    autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" required>
                <img src="Assets/mic.svg" alt="" class="search-icon search-icon--trailing" aria-hidden="true">
                <img src="Assets/sbi.svg" alt="" class="search-icon search-icon--trailing" aria-hidden="true">
            </div>

            <div class="search-actions">
                <button type="submit" class="btn-search">Google Search</button>
                <button type="button" class="btn-search" id="lucky-btn">I'm Feeling Lucky</button>
            </div>
        </form>

        <p class="lang">
            Google offered in:
            <a href="https://www.google.com/?hl=hi" class="langs" hreflang="hi">हिन्दी</a>
            <a href="https://www.google.com/?hl=bn" class="langs" hreflang="bn">বাংলা</a>
            <a href="https://www.google.com/?hl=te" class="langs" hreflang="te">తెలుగు</a>
            <a href="https://www.google.com/?hl=mr" class="langs" hreflang="mr">मराठी</a>
            <a href="https://www.google.com/?hl=ta" class="langs" hreflang="ta">தமிழ்</a>
            <a href="https://www.google.com/?hl=gu" class="langs" hreflang="gu">ગુજરાતી</a>
            <a href="https://www.google.com/?hl=kn" class="langs" hreflang="kn">ಕನ್ನಡ</a>
            <a href="https://www.google.com/?hl=ml" class="langs" hreflang="ml">മലയാളം</a>
            <a href="https://www.google.com/?hl=pa" class="langs" hreflang="pa">ਪੰਜਾਬੀ</a>
        </p>
    </main>

    <footer class="site-footer">
        <div class="footer-country">India</div>
        <nav class="footer-links" aria-label="Footer">
            <ul>
                <li><a href="https://ads.google.com/" class="footer-link">Advertising</a></li>
                <li><a href="https://business.google.com/" class="footer-link">Business</a></li>
                <li><a href="https://www.google.com/search/howsearchworks/" class="footer-link">How Search works</a></li>
            </ul>
            <ul>
                <li><a href="https://policies.google.com/privacy" class="footer-link">Privacy</a></li>
                <li><a href="https://policies.google.com/terms" class="footer-link">Terms</a></li>
                <li><a href="https://www.google.com/preferences" class="footer-link">Settings</a></li>
            </ul>
        </nav>
    </footer>

    <script src="script.js"></script>
</body>

</html>
