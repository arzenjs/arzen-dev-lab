<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- <link rel="icon" href="https://www.google.com/favicon.ico" type="image/x-icon"> -->
    <link rel="icon" href="Assets/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <ul>
                <li class="link">About</li>
                <li class="link">Store</li>
            </ul>
            <ul>
                <li class="link">Gmail</li>
                <li class="link">Images</li>
                <li><img src="Assets/9-Dot.svg" alt="Google Apps Icon" class="gi-icon link"></li>
                <li><button class="si-btn link">Sign in</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <img src="Assets/Logo.svg" alt="Google Logo" class="logo-img" link>
        <div class="search_con">
            <img src="Assets/search.svg" alt="" class="search-icon">
            <input type="search" name="Search" id="Search" class="search-bar" required>
            <img src="Assets/mic.svg" alt="" class="search-icon">
            <img src="Assets/sbi.svg" alt="" class="search-icon">
        </div>
        <div class="reco-search"><button class="reco-search-btns" link>Google Search</button><button
                class="reco-search-btns link">I'm Feeling Lucky</button></div>
        <div class="lang">Google offered in: <a href="" class="langs">हिन्दी</a> <a href="" class="langs">বাংলা</a> <a
                href="" class="langs">తెలుగు</a> <a href="" class="langs">मराठी</a> <a href="" class="langs">தமிழ்</a>
            <a href="" class="langs">ગુજરાતી</a> <a href="" class="langs">ಕನ್ನಡ</a> <a href="" class="langs">മലയാളം</a>
            <a href="" class="langs">ਪੰਜਾਬੀ</a>
        </div>
    </main>

    <footer>
        <div class="country"><span class="link">India</span></div>
        <div class="other">
            <div>
                <p class="link">Advertising</p>
                <p class="link">Business</p>
                <p class="link">How Search Works</p>
            </div>
            <div>
                <p class="link">Privacy</p>
                <p class="link">Terms</p>
                <p class="link">Settings</p>
            </div>
        </div>
    </footer>
</body>

</html>
