<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.3s ease;
    }

    body {
      height: 100vh;
      background: black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 20px);
      padding: clamp(10px, 5vw, 20px);
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      text-shadow: 0 0 20px #00f, 0 0 30px #00f;
    }

    h2 {
      font-size: clamp(1.5rem, 2.5vw, 2.5rem);
      margin-bottom: clamp(10px, 2vw, 20px);
      color: rgb(204 239 247);
      text-shadow: 0 0 10px #00f;
    }

    section {
      height: 60vh;
      width: clamp(300px, 50vw, 600px);
      padding: clamp(20px, 5vw, 30px);
      background: rgb(25, 25, 25);
      border: 2px solid #00f;
      box-shadow: 0 0 15px #00f;
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(15px, 3vw, 30px);
    }

    .modes {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2vw, 20px);
      width: 100%;
      max-width: clamp(300px, 80%, 500px);
    }

    .mode-btn {
      display: block;
      width: 100%;
      padding: clamp(10px, 1.5vw, 15px);
      text-decoration: none;
      color: white;
      background: #131212;
      border: 2px solid #00f;
      border-radius: 5px;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      box-shadow: 0 0 10px black;
      text-align: center;
      transition: all 0.5s ease;

      &:hover {
        background: #00f;
        color: black;
        box-shadow: 0 0 25px #00f;
        transform: scale(1.05);
      }

      &:active {
        transform: scale(1);
      }
    }

    .author {
      position: absolute;
      right: 5px;
      bottom: 5px;
      padding: 7px;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      letter-spacing: 0.1em;
      font-size: small;
      background-color: rgb(22, 22, 22);
      color: rgb(255, 255, 255);
    }

    .floating_bg {
      position: absolute;
      top: 0px;
      left: 0px;
      height: 100vh;
      width: 100vw;
      z-index: -1;
      overflow: hidden;
    }


    .floating_texts {
      position: absolute;
      color: rgba(255, 255, 255, 0.3);
      font-size: clamp(1rem, 3vw, 3rem);
      font-weight: bold;
      opacity: 0.7;
      animation: floatText 6s infinite alternate ease-in-out;
    }

    @keyframes floatText {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 0.5;
      }

      50% {
        transform: translateY(-20px) rotate(180deg) scale(1.1);
        opacity: 0.8;
      }

      100% {
        transform: translateY(-40px) rotate(360deg) scale(1);
        opacity: 0.5;
      }
    }
  </style>
  <title>Tic Tac Toe</title>
</head>

<body>
  <div class="floating_bg"></div>
  <h1>Tic Tac Toe</h1>

  <section>
    <h2>Choose Game Mode</h2>
    <div class="modes">
      <a href="player.html" class="mode-btn">2-Player</a>
      <a href="#" class="mode-btn" id="ai">Player vs AI</a>
      <a href="#" class="mode-btn" id="on">Player vs Player (Online)</a>
    </div>
    <button class="author">Made By Arsalan</button>
  </section>

  <script>
    const ai = document.querySelector("#ai")
    const on = document.querySelector("#on")

    ai.addEventListener("click", () => {
      alert("AI Mode Coming Soon....");
      alert("Stay Tuned For Upcoming Updates");
    })

    on.addEventListener("click", () => {
      alert("Online Mode Coming Soon....");
      alert("Stay Tuned For Upcoming Updates");
    })

    const floating_bg = document.querySelector(".floating_bg");

    function Floating_background() {
      for (let i = 0; i < 50; i++) {
        let floating_texts = document.createElement("div");
        floating_texts.classList.add("floating_texts");

        if (Math.random() > 0.5) {
          floating_texts.innerText = "X";
        } else {
          floating_texts.innerText = "O";
        }

        let randomxPosition = Math.ceil(0 + Math.random() * 100);
        let randomyPosition = Math.ceil(0 + Math.random() * 100);

        floating_texts.style.top = `${randomyPosition}vh`;
        floating_texts.style.left = `${randomxPosition}vw`;

        let randomSize = Math.ceil(10 + Math.random() * 20);

        floating_texts.style.fontSize = `${randomSize}px`

        floating_bg.appendChild(floating_texts);
      }
    }

    Floating_background();
  </script>
</body>

</html>
