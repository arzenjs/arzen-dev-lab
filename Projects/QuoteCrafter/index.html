<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuoteCrafter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E
%3Crect width='100' height='100' rx='20' fill='%2300bfff'/%3E
%3Cpath d='M25 30 h50 a5 5 0 0 1 5 5 v25 a5 5 0 0 1 -5 5 h-25 l-10 10 v-10 h-15 a5 5 0 0 1 -5 -5 v-25 a5 5 0 0 1 5 -5 z' fill='white'/%3E
%3Ccircle cx='75' cy='25' r='4' fill='white'/%3E
%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <!-- Theme toggle button -->
    <button class="theme-toggle">🌙</button>

    <!-- Main heading -->
    <h1>QuoteCrafter 💬</h1>

    <!-- Quote box -->
    <div class="quote-box">
      <p class="quote-text">A great quote will appear here...</p>
      <p class="quote-author">— Unknown</p>
      <div class="quote-buttons">
        <button class="new-quote-btn">🔁 New Quote</button>
        <button class="save-fav-btn">💖 Save to Favorites</button>
      </div>
    </div>

    <!-- Favorites section -->
    <div class="favorites-section">
      <div class="favorites-header">
        <h2>📚 My Favorite Quotes</h2>
        <button class="toggle-favs-btn">▲</button>
      </div>
      <p class="no-favs-msg">No favorites saved yet. Start adding some gems! 💎</p>
      <ul class="favorites-list">
      </ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
