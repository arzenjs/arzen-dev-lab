<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Page 2</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <img src="Assets/img.svg" alt="" class="svg">
        <div class="login-box">
            <h1>Create Account</h1>
            <div class="form-container">
                <form>
                    <div class="text">
                        Account Details -
                    </div>
                    <div class="input-box">
                        <label for="email">Email</label>
                        <input type="email" id="email">
                    </div>
                    <div class="input-box">
                        <label for="password">Password</label>
                        <input type="password" id="password">
                    </div>
                    <div class="input-box">
                        <label for="c-password">Confirm Paasword</label>
                        <input type="password" id="c-password">
                    </div>
                    <div class="input-box">
                        <label for="number">ABN Number</label>
                        <input type="number" id="number">
                    </div>
                    <div class="input-box">
                        <label for="text">Comments</label>
                        <input type="text" id="text">
                    </div>
            </div>
            <a href="page_3.html" class="link"><button type="submit" class="login-button">Continue</button></a>
            </form>
        </div>
    </div>
</body>

</html>
